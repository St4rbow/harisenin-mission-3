<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Masuk ke akun videobelajar">
    <title>Login - videobelajar</title>
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@600&display=swap">
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <header class="header">
        <a href="#" class="header-logo">
            <img src="assets/logo.png" alt="videobelajar">
        </a>
    </header>

    <main class="main">
        <section class="card">
            <div class="card-header">
                <h1 class="card-title">Masuk ke Akun</h1>
                <p class="card-subtitle">Yuk, lanjutin belajarmu di videobelajar.</p>
            </div>

            <form class="form" action="#" method="post">
                <div class="form-group">
                    <label for="email" class="form-label">E-Mail <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-input" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Kata Sandi <span class="required">*</span></label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" class="form-input"
                            autocomplete="current-password" required>
                        <button type="button" class="password-toggle" aria-label="Tampilkan kata sandi">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                                <path class="eye-slash" d="M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <a href="#" class="forgot-link">Lupa Password?</a>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Masuk</button>
                    <a href="register.html" class="btn btn-secondary">Daftar</a>
                </div>
            </form>

            <div class="divider"><span>atau</span></div>

            <button type="button" class="btn btn-google">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#FFC107"
                        d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5Z" />
                    <path fill="#FF3D00"
                        d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7Z" />
                    <path fill="#4CAF50"
                        d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2A11.9 11.9 0 0 1 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44Z" />
                    <path fill="#1976D2"
                        d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5Z" />
                </svg>
                Masuk dengan Google
            </button>
        </section>
    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const toggleButton = document.querySelector(".password-toggle");

        toggleButton.addEventListener("click", () => {
            const show = passwordInput.type === "password";
            passwordInput.type = show ? "text" : "password";
            toggleButton.classList.toggle("is-visible", show);
            toggleButton.setAttribute("aria-label", show ? "Sembunyikan kata sandi" : "Tampilkan kata sandi");
        });
    </script>
</body>

</html>
